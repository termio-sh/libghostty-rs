name: Bindings drift

# `libghostty-vt-sys` checks its generated bindings into the tree, so the pin in
# build.rs and `src/bindings.rs` are two facts that can disagree. When they do,
# nothing fails to build — the struct layouts simply stop matching the headers
# and the library corrupts memory at runtime. Downstream that surfaced as
# unrelated HashMaps spinning forever inside hashbrown's probe loop, in tests
# that never touched a terminal.
#
# So: regenerate against the ghostty the pin actually builds, and fail if the
# result differs from what is committed. Bumping GHOSTTY_COMMIT without
# regenerating is the mistake this job exists to catch.
#
# It runs on macOS because the generator is host-aware — it adds
# `-I/usr/include` under `cfg!(target_os = "linux")` — so the same pin yields
# different output per host. The committed bindings carry `ENUM_MAX_VALUE`,
# which a Linux run drops, and upstream's own bindings carry it too. Generating
# where they were generated is what makes a diff mean drift instead of "wrong
# runner"; a check that cries wolf is one people learn to ignore.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"

jobs:
  drift:
    name: Regenerated bindings match the tree
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          # Deliberately not caching `target/`: it holds a full ghostty clone
          # plus a Zig archive, and a stale one is exactly what this job is
          # meant to detect.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Select the Command Line Tools SDK
        # Recent Xcode SDKs advertise libSystem as arm64e only, which Zig cannot
        # link against — the failure is a wall of `undefined symbol: _malloc`
        # from the build runner. The CLT SDK still advertises arm64. Asserted
        # rather than assumed so an image change fails with one readable line.
        run: |
          set -euo pipefail
          clt=/Library/Developer/CommandLineTools
          if [ ! -d "$clt/SDKs" ]; then
            echo "::error::$clt/SDKs is missing on this runner image; Zig cannot link without it"
            exit 1
          fi
          echo "DEVELOPER_DIR=$clt" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Install Zig ${{ env.ZIG_VERSION }}
        # The pinned ghostty declares minimum_zig_version 0.16.0, and
        # `libghostty-vt-sys` invokes `zig` by name — it honours no ZIG override,
        # so the toolchain has to be on PATH.
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o zig.tar.xz "$url"
          echo "${ZIG_SHA256}  zig.tar.xz" | shasum -a 256 -c -
          tar xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Zig version
        run: zig version

      - name: Build the -sys crate
        # Fetches the pinned ghostty and produces the headers the generator
        # reads out of target/debug/build/libghostty-vt-sys-*/out.
        run: cargo build -p libghostty-vt-sys

      - name: Point the generator at the pin's own headers
        # Left to itself the generator walks target/debug/build for a
        # `libghostty-vt-sys-*` output and takes what it finds first. With more
        # than one build hash present that can be a *different* ghostty, so it
        # regenerates identical bindings and the drift check passes while blind.
        # A fresh runner only has one, but a guard that depends on that is the
        # same implicit assumption this job exists to remove.
        run: |
          set -euo pipefail
          pin=$(grep -oE '[0-9a-f]{40}' crates/libghostty-vt-sys/build.rs | head -1)
          echo "pin: $pin"
          include=""
          for out in target/debug/build/libghostty-vt-sys-*/out; do
            [ -f "$out/ghostty-src/.ghostty-commit" ] || continue
            [ "$(cat "$out/ghostty-src/.ghostty-commit")" = "$pin" ] || continue
            [ -d "$out/ghostty-install/include" ] || continue
            include="$out/ghostty-install/include"
          done
          if [ -z "$include" ]; then
            echo "::error::no build output found for pinned ghostty $pin"
            exit 1
          fi
          echo "headers: $include"
          echo "GHOSTTY_INCLUDE_DIR=$PWD/$include" >> "$GITHUB_ENV"

      - name: Regenerate bindings
        run: cargo run -p libghostty-vt-sys --features bindgen-tool --bin gen-bindings

      - name: Upload the regenerated bindings
        # The generator needs Zig and a full ghostty build, which not every
        # machine can run — a Tahoe host deadlocks partway through. Publishing
        # the result makes this job the way to obtain bindings for a new pin,
        # not just the way to be told they are stale. Uploaded even when the
        # diff check below fails, because that is exactly when they are wanted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: crates/libghostty-vt-sys/src/bindings.rs
          if-no-files-found: error

      - name: Fail if they differ from what is committed
        run: |
          if ! git diff --exit-code -- crates/libghostty-vt-sys/src/bindings.rs; then
            echo "::error::src/bindings.rs does not match bindings regenerated against the pinned ghostty."
            echo "::error::Run: cargo build -p libghostty-vt-sys && cargo run -p libghostty-vt-sys --features bindgen-tool --bin gen-bindings"
            echo "::error::Commit the result together with the pin change — never one without the other."
            exit 1
          fi

      - name: Build and test the safe wrapper
        run: cargo test
